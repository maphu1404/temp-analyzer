<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Test Analyzer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>

<style>
  :root {
    --bg: #0f172a; 
    --card: #1e293b; 
    --card-alt: #243447;
    --accent: #38bdf8; 
    --accent2: #22c55e; 
    --accent3: #f59e0b;
    --accent4: #a78bfa; 
    --danger: #ef4444;
    --text: #e2e8f0; 
    --muted: #94a3b8; 
    --border: #334155;
    --chart-bg: #1e293b;
    --chart-grid: rgba(51,65,85,0.4);
  }

  body.light-mode {
    --bg: #f8fafc;
    --card: #ffffff;
    --card-alt: #f1f5f9;
    --accent: #0284c7;
    --accent2: #16a34a;
    --accent3: #d97706;
    --accent4: #7c3aed;
    --danger: #dc2626;
    --text: #1e293b;
    --muted: #64748b;
    --border: #cbd5e1;
    --chart-bg: #ffffff;
    --chart-grid: rgba(203,213,225,0.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; padding:0;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    transition: background 0.3s, color 0.3s;
  }
  .container{
    max-width:1400px; margin:0 auto;
    padding:20px 22px 40px;
  }
  .header-top {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  header h1{
    font-size:18px; font-weight:600;
    margin:8px 0 2px;
  }
  header p{
    font-size:12px; color:var(--muted);
    margin:0 0 14px;
  }
  .theme-toggle {
    background: var(--card-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .theme-toggle:hover { background: var(--border); }

  .dropzone{
    border:2px solid var(--accent);
    background:var(--card);
    border-radius:6px;
    padding:14px;
    text-align:center;
    cursor:pointer;
    font-size:13px;
    color:var(--text);
    transition:background .15s;
  }
  .dropzone:hover, .dropzone.dragover{
    background:var(--card-alt);
    border-color:var(--accent2);
  }
  input[type=file]{display:none;}
  .file-info{
    font-size:11px; color:var(--muted);
    margin:8px 2px 12px;
    word-break:break-all;
  }
  .layout{
    display:grid;
    grid-template-columns: 1.3fr 1fr;
    gap:14px;
    margin-top:8px;
  }
  .left-col, .right-col{
    display:flex; flex-direction:column;
    gap:12px;
  }
  @media(max-width:900px){
    .layout{grid-template-columns:1fr;}
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:5px;
    padding:8px 12px;
  }
  .card.alt{background:var(--card-alt);}
  .card.ok{border-left-color:var(--accent2);}
  .card.fail{border-left-color:var(--danger);}
  .row1{
    display:flex; align-items:center;
    gap:6px; flex-wrap:wrap;
  }
  .name{
    font-weight:600; font-size:13px;
    width:72px; flex-shrink:0;
  }
  .lbl{font-size:11px; color:var(--muted);}
  .time{
    font-family:Consolas,"SF Mono",monospace;
    font-weight:700; font-size:12px;
    color:var(--accent);
  }
  .status{
    margin-left:auto;
    font-size:13px; font-weight:700;
  }
  .status.ok{color:var(--accent2);}
  .status.fail{color:var(--danger);}
  .row2{
    display:flex; gap:16px; flex-wrap:wrap;
    margin-top:3px; font-size:11px;
  }
  .dur{
    font-family:Consolas,monospace;
    font-weight:700; color:var(--accent2);
    font-size:12px;
  }
  .rate{
    font-family:Consolas,monospace;
    font-weight:700; color:var(--accent4);
    font-size:12px;
  }
  .runtime{
    background:var(--card);
    border:1px solid var(--border);
    border-left:3px solid var(--accent3);
    border-radius:5px;
    padding:10px 12px;
  }
  .runtime .title{
    font-weight:600; font-size:13px;
    margin-bottom:4px;
  }
  .runtime .val{
    font-family:Consolas,monospace;
    font-weight:700; font-size:13px;
    color:var(--accent3);
  }
  .chart-wrap{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:6px;
    padding:10px;
    height:520px;
    position:relative;
    display: none;
    transition: background 0.3s;
  }
  .chart-wrap .zoom-hint{
    position:absolute; bottom:6px; right:10px;
    font-size:10px; color:var(--muted);
    pointer-events:none;
  }
  @media(max-width:900px){
    .chart-wrap{height:340px;}
  }
  .toolbar{
    display:flex; gap:8px; margin-top:14px;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit; font-size:12px; font-weight:600;
    padding:8px 14px; border:none; border-radius:4px;
    cursor:pointer; color:#fff; background:var(--accent);
    transition:filter .15s;
  }
  button:hover{filter:brightness(1.15);}
  button.danger{background:var(--danger); margin-left:auto;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button.zoom-btn{
    background:#475569; font-size:11px; padding:6px 10px;
  }
  button.img-btn {
    background:#8b5cf6; font-size:11px; padding:6px 10px;
  }
  @media(max-width:600px){
    .name{width:auto;}
    .time{font-size:11px;}
  }
</style>
</head>
<body>
<div class="container">

  <div class="header-top">
    <header>
      <h1>Temperature Test Analyzer</h1>
      <p>Load either Radwin CSV format to analyze the thermal test phases</p>
    </header>
    <button class="theme-toggle" id="themeToggle" title="Toggle Light/Dark Mode">🌙 Dark</button>
  </div>

  <div class="dropzone" id="dropzone">
    ⬇   Drag & Drop your CSV here  ·  or click to browse
  </div>
  <input type="file" id="fileInput" accept=".csv">

  <div class="file-info" id="fileInfo">No file loaded</div>

  <div class="layout">
    <div class="left-col">
      <div id="chartContainer"></div>
    </div>

    <div class="right-col">
      <div id="cards"></div>
      <div class="runtime" id="runtimeCard" style="display:none;">
        <div class="title">⏱ Total Test Runtime</div>
        <div class="val" id="runtimeHM">—</div>
        <div class="val" id="runtimeHrs" style="color:var(--muted);">Decimal hours: —</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button id="btnZoomReset" class="zoom-btn" disabled>🔍 Reset Zoom</button>
    <button id="btnSaveImg" class="img-btn" disabled>📸 Save Chart Image</button>
    <button id="btnCopy" disabled>📋 Copy</button>
    <button id="btnSave" disabled>💾 Save</button>
    <button id="btnClear" class="danger" disabled>🗑 Clear</button>
  </div>

</div>

<script>
try {
  if (window['chartjs-plugin-annotation']) {
    Chart.register(window['chartjs-plugin-annotation']);
  }

  let isExporting = false;

  const zoneLabelPlugin = {
    id: 'zoneLabelPlugin',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      const zones = [
        { name: "Start", startIdx: 0 },
        { name: "-40 Soak", startIdx: chart.temp_neg40Reached },
        { name: "Rise", startIdx: chart.temp_riseStart },
        { name: "+70 Soak", startIdx: chart.temp_pos70Reached },
        { name: "25 Dip", startIdx: chart.temp_fallStart, isLast: true } 
      ];

      // Use the actual max data index for the end of the last zone
      const endIdxs = [
        chart.temp_neg40Reached,
        chart.temp_riseStart,
        chart.temp_pos70Reached,
        chart.temp_fallStart,
        chart.data.labels.length - 1
      ];

      const yPos = chart.scales.y.top + 25;
      
      const style = getComputedStyle(document.body);
      const textColor = isExporting ? '#1e293b' : style.getPropertyValue('--text').trim();
      const bgColor = isExporting ? '#ffffff' : style.getPropertyValue('--card').trim();

      ctx.save();
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      zones.forEach((zone, i) => {
        const start = zone.startIdx;
        let end = endIdxs[i];

        if (start !== null && start !== undefined && end !== null && end !== undefined) {
          const midX = (chart.scales.x.getPixelForValue(start) + chart.scales.x.getPixelForValue(end)) / 2;
          
          if (midX > chart.scales.x.left && midX < chart.scales.x.right) {
            const textWidth = ctx.measureText(zone.name).width;
            ctx.fillStyle = bgColor;
            ctx.globalAlpha = 0.7;
            ctx.fillRect(midX - textWidth/2 - 4, yPos - 10, textWidth + 8, 20);
            ctx.globalAlpha = 1.0;
            
            ctx.fillStyle = textColor;
            ctx.fillText(zone.name, midX, yPos);
          }
        }
      });
      ctx.restore();
    }
  };

  Chart.register(zoneLabelPlugin);

  const DIP_DROP_COUNT  = 5;
  const SV_DROP_MIN     = 0.05;
  const PV_SV_TOLERANCE = 1.0;
  const TOL_CONSECUTIVE = 5;
  const NEG40_TARGET    = -40.0;
  const POS70_TARGET    = 70.0;
  const POS25_TARGET    = 25.0;
  const POS25_BAND      = 1.0;
  const SV_STEP         = 0.05;

  const RATE_STATES = new Set(["-40 Dip", "70 Rise", "25 Dip"]);
  const RANGE_ORDER = ["-40 Dip", "-40 Soak", "70 Rise", "70 Soak", "25 Dip"];

  const dropzone    = document.getElementById("dropzone");
  const fileInput   = document.getElementById("fileInput");
  const fileInfo    = document.getElementById("fileInfo");
  const cardsDiv    = document.getElementById("cards");
  const chartContainer = document.getElementById("chartContainer");
  const runtimeCard = document.getElementById("runtimeCard");
  const runtimeHM   = document.getElementById("runtimeHM");
  const runtimeHrs  = document.getElementById("runtimeHrs");
  const btnCopy     = document.getElementById("btnCopy");
  const btnSave     = document.getElementById("btnSave");
  const btnSaveImg  = document.getElementById("btnSaveImg");
  const btnClear    = document.getElementById("btnClear");
  const btnZoomReset= document.getElementById("btnZoomReset");
  const themeToggle = document.getElementById("themeToggle");

  let lastReport = "";
  let tempChart = null;
  let minIndex = 0;
  let maxIndex = 999999;
  let totalDataPoints = 0;
  let isLightMode = false;

  themeToggle.addEventListener("click", () => {
    isLightMode = !isLightMode;
    document.body.classList.toggle("light-mode", isLightMode);
    themeToggle.innerHTML = isLightMode ? "☀️ Light" : "🌙 Dark";

    if (tempChart) {
      const style = getComputedStyle(document.body);
      const textCol = style.getPropertyValue('--text').trim();
      const gridCol = style.getPropertyValue('--chart-grid').trim();

      tempChart.options.plugins.legend.labels.color = textCol;
      tempChart.options.scales.x.ticks.color = textCol;
      tempChart.options.scales.y.ticks.color = textCol;
      tempChart.options.scales.x.grid.color = gridCol;
      tempChart.options.scales.y.grid.color = gridCol;
      
      tempChart.update();
    }
  });

  function buildCards(){
    cardsDiv.innerHTML = "";
    RANGE_ORDER.forEach((name, i) => {
      const card = document.createElement("div");
      card.className = "card" + (i % 2 ? " alt" : "");
      card.id = "card-" + cssId(name);
      card.innerHTML = `
        <div class="row1">
          <span class="name">${name}</span>
          <span class="lbl">Start:</span>
          <span class="time start">—</span>
          <span class="lbl">End:</span>
          <span class="time end">—</span>
          <span class="status">—</span>
        </div>
        <div class="row2">
          <span class="lbl">Duration:</span>
          <span class="dur">—</span>
          <span class="rate-wrap" style="display:none;">
            <span class="lbl">Rate:</span>
            <span class="rate">—</span>
          </span>
        </div>
      `;
      cardsDiv.appendChild(card);
    });
  }
  function cssId(name){ return name.replace(/[^a-z0-9]/gi, "_"); }
  buildCards();

  dropzone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", e => {
    if (e.target.files.length) handleFile(e.target.files[0]);
  });
  ["dragenter","dragover"].forEach(ev =>
    dropzone.addEventListener(ev, e => {
      e.preventDefault(); dropzone.classList.add("dragover");
    })
  );
  ["dragleave","drop"].forEach(ev =>
    dropzone.addEventListener(ev, e => {
      e.preventDefault(); dropzone.classList.remove("dragover");
    })
  );
  dropzone.addEventListener("drop", e => {
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });

  function handleFile(file){
    if (!file.name.toLowerCase().endsWith(".csv")){
      alert("Please drop a CSV file.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const bytes = new Uint8Array(reader.result);
      const text = decodeBytes(bytes);
      processCSVText(text, file.name);
    };
    reader.readAsArrayBuffer(file);
  }

  function decodeBytes(bytes){
    try {
      return new TextDecoder("utf-8", {fatal:true}).decode(bytes);
    } catch(e){}
    for (const enc of ["windows-1252","latin1","gbk","big5"]){
      try {
        return new TextDecoder(enc, {fatal:false}).decode(bytes);
      } catch(e){}
    }
    return new TextDecoder("utf-8").decode(bytes);
  }

  function splitCSVRow(line, delimiter = ','){
    const out=[]; let field='', quoted=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){
        if(quoted && line[i+1]==='"'){field+='"';i++;}
        else quoted=!quoted;
      }else if(c===delimiter && !quoted){out.push(field.trim());field='';}
      else field+=c;
    }
    out.push(field.trim());
    return out;
  }

  function processCSVText(text, filename){
    const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim().length);
    if(lines.length<2){alert('No data rows found.');return;}
    
    const firstLine = lines[0];
    let delimiter = ',';
    if (firstLine.split(';').length > firstLine.split(',').length) delimiter = ';';
    else if (firstLine.split('\t').length > firstLine.split(',').length) delimiter = '\t';

    const header=splitCSVRow(lines[0], delimiter).map(h=>h.replace(/^"|"$/g,'').trim().toLowerCase());
    const timeCol=header.findIndex(h=>h==='mcgs_time');
    const tc=timeCol>=0?timeCol:0;
    
    const data=[]; let skipped=0;
    for(let i=1;i<lines.length;i++){
      const p=splitCSVRow(lines[i], delimiter);
      if(p.length<4){skipped++;continue;}
      const ts=parseTimestamp(p[tc]);
      const pv=Number(p[2]),sv=Number(p[3]);
      if(!ts || !Number.isFinite(pv) || !Number.isFinite(sv) || !p[2].trim() || !p[3].trim()){
        skipped++;continue;
      }
      data.push({time:ts,pv,sv});
    }
    if(!data.length){alert('No valid temperature rows found. Check CSV columns and date format.');return;}
    data.sort((a,b)=>a.time-b.time);
    const ranges=analyze(data);
    renderResults(data,ranges,filename);
    if(skipped) fileInfo.textContent+=`  •  ${skipped} skipped rows`;
  }

  function parseTimestamp(str){
    if(!str)return null;
    const m=String(str).trim().replace(/^"|"$/g,'').match(/^(\d{4}|\d{1,2})[\/-](\d{1,2})[\/-](\d{1,4})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if(!m)return null;
    let y,mo,d;
    if(m[1].length===4){y=+m[1];mo=+m[2];d=+m[3];}
    else if(m[3].length===4){mo=+m[1];d=+m[2];y=+m[3];}
    else return null;
    const h=+m[4],mi=+m[5],sec=+(m[6]||0);
    const dt=new Date(y,mo-1,d,h,mi,sec);
    if(dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d || dt.getHours()!==h || dt.getMinutes()!==mi || dt.getSeconds()!==sec)return null;
    return dt;
  }

  function analyze(data){
    const n = data.length;
    const pv = data.map(d => d.pv);
    const sv = data.map(d => d.sv);

    let testStart = null;
    for (let i = 0; i < n - DIP_DROP_COUNT; i++){
      let ok = true;
      for (let k = 1; k <= DIP_DROP_COUNT; k++){
        if (!(sv[i+k] < sv[i+k-1] - SV_DROP_MIN)){ ok = false; break; }
      }
      if (ok){ testStart = i; break; }
    }
    if (testStart === null) testStart = 0;

    let neg40Reached = null;
    for (let i = testStart; i < n; i++){
      if (Math.abs(sv[i] - NEG40_TARGET) <= 0.1){
        let ok = true;
        for (let j = i; j < i + TOL_CONSECUTIVE && j < n; j++){
          if (!(pv[j] <= sv[j] + PV_SV_TOLERANCE)){ ok = false; break; }
        }
        if (ok){ neg40Reached = i; break; }
      }
    }

    let riseStart = null;
    if (neg40Reached !== null){
      for (let i = neg40Reached + 1; i < n; i++){
        if (sv[i] > sv[i-1] + SV_STEP){ riseStart = i; break; }
      }
    }

    let pos70Reached = null;
    if (riseStart !== null){
      for (let i = riseStart; i < n; i++){
        if (Math.abs(sv[i] - POS70_TARGET) <= 0.1){
          let ok = true;
          for (let j = i; j < i + TOL_CONSECUTIVE && j < n; j++){
            if (!(pv[j] >= sv[j] - PV_SV_TOLERANCE)){ ok = false; break; }
          }
          if (ok){ pos70Reached = i; break; }
        }
      }
    }

    let fallStart = null;
    if (pos70Reached !== null){
      for (let i = pos70Reached + 1; i < n; i++){
        if (sv[i] < sv[i-1] - SV_STEP){ fallStart = i; break; }
      }
    }

    let pos25Reached = null;
    if (fallStart !== null){
      for (let i = fallStart; i < n; i++){
        if (Math.abs(sv[i] - POS25_TARGET) <= POS25_BAND){
          pos25Reached = i; break;
        }
      }
      if (pos25Reached === null) {
        pos25Reached = n - 1; 
      }
    }

    const pt = idx => idx === null ? null : {
      idx, time: data[idx].time, pv: data[idx].pv, sv: data[idx].sv
    };

    return {
      "-40 Dip":  [pt(testStart),   pt(neg40Reached)],
      "-40 Soak": [pt(neg40Reached),pt(riseStart)],
      "70 Rise":  [pt(riseStart),   pt(pos70Reached)],
      "70 Soak":  [pt(pos70Reached),pt(fallStart)],
      "25 Dip":   [pt(fallStart),   pt(pos25Reached)],
    };
  }

  function pad2(n){ return String(n).padStart(2,"0"); }
  function fmtTime(d){
    return `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())}  ` +
           `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }
  function fmtDuration(ms){
    const totalMin = Math.floor(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return `${h}:${pad2(m)}:00`;
  }
  function fmtHM(ms){
    const totalMin = Math.floor(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    const hStr = `${h} hour${h!==1?"s":""}`;
    const mStr = `${m} minute${m!==1?"s":""}`;
    if (h === 0) return mStr;
    if (m === 0) return hStr;
    return `${hStr} and ${mStr}`;
  }
  function fmtHrs(ms){
    return (ms / 3600000).toFixed(3);
  }
  function computeRate(start, end){
    if (!start || !end) return "—";
    const dtMin = (end.time - start.time) / 60000;
    if (dtMin <= 0) return "—";
    const dPV = end.pv - start.pv;
    const rate = dPV / dtMin;
    const sign = rate >= 0 ? "+" : "";
    return `${sign}${rate.toFixed(2)} °C/min`;
  }

  function renderResults(data, ranges, filename){
    fileInfo.textContent =
     `📄 ${filename}  •  ${data.length} pts  ·  ` +
      `${fmtTime(data[0].time)} → ${fmtTime(data[data.length-1].time)}`;

    const reportLines = [];

    RANGE_ORDER.forEach(name => {
      const [start, end] = ranges[name];
      const card = document.getElementById("card-" + cssId(name));
      card.classList.remove("ok","fail");
      const startEl = card.querySelector(".start");
      const endEl = card.querySelector(".end");
      const statusEl = card.querySelector(".status");
      const durEl = card.querySelector(".dur");
      const rateWrap = card.querySelector(".rate-wrap");
      const rateEl = card.querySelector(".rate");

      if (start && end){
        card.classList.add("ok");
        startEl.textContent = fmtTime(start.time);
        endEl.textContent   = fmtTime(end.time);
        statusEl.textContent = "✓";
        statusEl.className = "status ok";
        durEl.textContent = fmtDuration(end.time - start.time);

        let line = `${name.padEnd(10)}(start = ${fmtTime(start.time)} | end = ${fmtTime(end.time)}) [${fmtDuration(end.time-start.time)}];`;

        if (RATE_STATES.has(name)){
          const r = computeRate(start, end);
          rateEl.textContent = r;
          rateWrap.style.display = "";
          line += `  rate = ${r};`;
        } else {
          rateWrap.style.display = "none";
        }
        reportLines.push(line);
      } else {
        card.classList.add("fail");
        startEl.textContent = "—";
        endEl.textContent   = "—";
        statusEl.textContent = "✗";
        statusEl.className = "status fail";
        durEl.textContent = "—";
        rateWrap.style.display = "none";
        reportLines.push(`${name.padEnd(10)}NOT FOUND`);
      }
    });

    const startPt = ranges["-40 Dip"][0];
    const endPt   = ranges["25 Dip"][1];
    runtimeCard.style.display = "";
    let runtimeLine;
    if (startPt && endPt){
      const td = endPt.time - startPt.time;
      runtimeHM.textContent  = fmtHM(td);
      runtimeHrs.textContent = `Decimal hours: ${fmtHrs(td)} h`;
      runtimeLine = `Total runtime: ${fmtHM(td)} (${fmtHrs(td)} h)`;
    } else {
      runtimeHM.textContent  = "—";
      runtimeHrs.textContent = "Decimal hours: —";
      runtimeLine = "Total runtime: NOT AVAILABLE";
    }

    const header = [
      "TEST ANALYSIS REPORT",
      "=".repeat(60),
      `File         : ${filename}`,
      `Total points : ${data.length}`,
      `First row    : ${fmtTime(data[0].time)}`,
      `Last row     : ${fmtTime(data[data.length-1].time)}`,
      "",
      "RANGES",
      "-".repeat(60),
    ];
    lastReport = [...header, ...reportLines, "", "-".repeat(60), runtimeLine].join("\n");

    chartContainer.innerHTML = `
      <div class="chart-wrap" id="chartWrap">
        <canvas id="tempChart"></canvas>
        <div class="zoom-hint">🖱️ Scroll to zoom · Drag to pan · Double-click to reset</div>
      </div>
    `;

    document.getElementById("chartWrap").style.display = "block";

    setTimeout(() => {
      try {
        buildChart(data, ranges);
      } catch (err) {
        alert("Chart drawing error: " + err.message);
      }
    }, 50);

    btnCopy.disabled = false;
    btnSave.disabled = false;
    btnSaveImg.disabled = false;
    btnClear.disabled = false;
    btnZoomReset.disabled = false;
  }

  function buildChart(data, ranges){
    const ctx = document.getElementById("tempChart").getContext("2d");
    totalDataPoints = data.length;

    const style = getComputedStyle(document.body);
    const textCol = style.getPropertyValue('--text').trim();
    const gridCol = style.getPropertyValue('--chart-grid').trim();
    const bgCol = style.getPropertyValue('--chart-bg').trim();

    const labels = data.map(d =>
      `${pad2(d.time.getHours())}:${pad2(d.time.getMinutes())}`
    );
    const pvData = data.map(d => d.pv);
    const svData = data.map(d => d.sv);

    let globalMin = Math.min(...pvData, ...svData);
    let globalMax = Math.max(...pvData, ...svData);
    
    globalMin = Math.floor((globalMin - 5) / 5) * 5;
    globalMax = Math.ceil((globalMax + 5) / 5) * 5;

    const idxOf = pt => pt ? pt.idx : null;

    const boundaries = {
      "-40 Dip":  { start: idxOf(ranges["-40 Dip"][0]),  end: idxOf(ranges["-40 Dip"][1])  },
      "-40 Soak": { start: idxOf(ranges["-40 Soak"][0]), end: idxOf(ranges["-40 Soak"][1]) },
      "70 Rise":  { start: idxOf(ranges["70 Rise"][0]),  end: idxOf(ranges["70 Rise"][1])  },
      "70 Soak":  { start: idxOf(ranges["70 Soak"][0]),  end: idxOf(ranges["70 Soak"][1])  },
      "25 Dip":   { start: idxOf(ranges["25 Dip"][0]),   end: idxOf(ranges["25 Dip"][1])   },
    };

    // FIX: If the 25 Dip didn't reach 25C, extend its background band to the end.
    if (boundaries["25 Dip"].start !== null && boundaries["25 Dip"].end === null) {
      boundaries["25 Dip"].end = data.length - 1;
    }

    const phaseColors = {
      "-40 Dip":  "rgba(56,189,248,0.08)",
      "-40 Soak": "rgba(34,197,94,0.08)",
      "70 Rise":  "rgba(245,158,11,0.08)",
      "70 Soak":  "rgba(239,68,68,0.08)",
      "25 Dip":   "rgba(167,139,250,0.08)",
    };

    const annotations = {};

    Object.entries(boundaries).forEach(([name, {start, end}]) => {
      if (start !== null && end !== null && end > start){
        annotations["band_" + name] = {
          type: "box",
          xMin: start, xMax: end,
          backgroundColor: phaseColors[name],
          borderWidth: 0,
          drawTime: "beforeDatasetsDraw",
        };
      }
    });

    const boundaryPoints = [
      { idx: boundaries["-40 Dip"].start },
      { idx: boundaries["-40 Dip"].end   },
      { idx: boundaries["-40 Soak"].end  },
      { idx: boundaries["70 Rise"].end   },
      { idx: boundaries["70 Soak"].end   },
      { idx: boundaries["25 Dip"].end    },
    ];

    boundaryPoints.forEach((b, i) => {
      if (b.idx === null || b.idx === undefined) return;
      annotations["line" + i] = {
        type: "line",
        xMin: b.idx, xMax: b.idx,
        borderColor: "rgba(148,163,184,0.55)",
        borderWidth: 1,
        borderDash: [4, 4],
      };
    });

    if (tempChart){ tempChart.destroy(); tempChart = null; }

    minIndex = 0;
    
    // FIX: Add 5% padding to the right side of the chart so the final label has room
    const xAxisPadding = Math.ceil(totalDataPoints * 0.05); 
    maxIndex = totalDataPoints - 1 + xAxisPadding;

    tempChart = new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: "PV (°C)",
            data: pvData,
            borderColor: "#38bdf8",
            backgroundColor: "rgba(56,189,248,0.12)",
            borderWidth: 1.6,
            pointRadius: 0,
            tension: 0.2,
            fill: true,
          },
          {
            label: "SV (°C)",
            data: svData,
            borderColor: "#f59e0b",
            backgroundColor: "transparent",
            borderWidth: 1.6,
            borderDash: [6, 4],
            pointRadius: 0,
            tension: 0.2,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 0 },
        interaction: { mode: "index", intersect: false },
        layout: {
          padding: { top: 25 } 
        },
        plugins: {
          legend: {
            labels: { color: textCol, font: { size: 11 }, boxWidth: 12, boxHeight: 12 },
          },
          tooltip: {
            backgroundColor: bgCol,
            borderColor: textCol,
            borderWidth: 1,
            titleColor: textCol,
            bodyColor: textCol,
            callbacks: {
              label: c => `${c.dataset.label}: ${c.parsed.y.toFixed(2)} °C`,
            },
          },
          annotation: { annotations }
        },
        scales: {
          x: {
            min: 0,
            suggestedMax: maxIndex, // Use padded max here to ensure space is allocated
            ticks: {
              color: textCol,
              font: { size: 9 },
              maxRotation: 0,
              autoSkip: true,
              maxTicksLimit: 12,
            },
            grid: { color: gridCol },
          },
          y: {
            min: globalMin,
            max: globalMax,
            ticks: {
              color: textCol,
              font: { size: 10 },
              callback: v => v + " °C",
            },
            grid: { color: gridCol },
          },
        },
      }
    });

    tempChart.temp_neg40Reached = boundaries["-40 Dip"].end;
    tempChart.temp_riseStart = boundaries["-40 Soak"].end;
    tempChart.temp_pos70Reached = boundaries["70 Rise"].end;
    tempChart.temp_fallStart = boundaries["70 Soak"].end;

    attachCustomZoomEvents(ctx.canvas);
  }

  function attachCustomZoomEvents(canvas) {
    let isDragging = false;
    let startX = 0;
    let startMin = 0;
    let startMax = 0;

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (!tempChart) return;

      const zoomFactor = 0.15;
      const range = maxIndex - minIndex;
      const delta = range * zoomFactor;

      if (e.deltaY < 0) {
        if (range > 10) {
          minIndex += delta / 2;
          maxIndex -= delta / 2;
        }
      } else {
        minIndex -= delta / 2;
        maxIndex += delta / 2;
      }

      if (minIndex < 0) minIndex = 0;
      
      const xAxisPadding = Math.ceil(totalDataPoints * 0.05);
      if (maxIndex > totalDataPoints - 1 + xAxisPadding) {
         maxIndex = totalDataPoints - 1 + xAxisPadding;
      }

      applyZoom();
    });

    canvas.addEventListener("mousedown", (e) => {
      isDragging = true;
      startX = e.clientX;
      startMin = minIndex;
      startMax = maxIndex;
      canvas.style.cursor = "grabbing";
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging || !tempChart) return;
      
      const deltaX = e.clientX - startX;
      const chartWidth = canvas.getBoundingClientRect().width;
      const pixelsPerIndex = chartWidth / (startMax - startMin);
      
      const indexShift = -(deltaX / pixelsPerIndex);
      
      let newMin = startMin + indexShift;
      let newMax = startMax + indexShift;

      const xAxisPadding = Math.ceil(totalDataPoints * 0.05);

      if (newMin >= 0 && newMax <= totalDataPoints - 1 + xAxisPadding) {
        minIndex = newMin;
        maxIndex = newMax;
        applyZoom();
      }
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
      canvas.style.cursor = "crosshair";
    });

    canvas.addEventListener("dblclick", () => {
      if (!tempChart) return;
      minIndex = 0;
      const xAxisPadding = Math.ceil(totalDataPoints * 0.05);
      maxIndex = totalDataPoints - 1 + xAxisPadding;
      applyZoom();
    });

    canvas.style.cursor = "crosshair";

    function applyZoom() {
      if (tempChart) {
        tempChart.options.scales.x.min = Math.max(0, Math.round(minIndex));
        tempChart.options.scales.x.max = Math.min(totalDataPoints - 1 + Math.ceil(totalDataPoints * 0.05), Math.round(maxIndex));
        tempChart.update('none');
      }
    }
  }

  btnCopy.addEventListener("click", () => {
    navigator.clipboard.writeText(lastReport).then(
      () => alert("Report copied to clipboard."),
      () => alert("Copy failed — try manually selecting text.")
    );
  });

  btnSave.addEventListener("click", () => {
    const blob = new Blob([lastReport], {type:"text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "test_report.txt";
    a.click();
    URL.revokeObjectURL(url);
  });

  btnSaveImg.addEventListener("click", () => {
    if (!tempChart) return;
    
    isExporting = true;

    const originalBg = tempChart.options.plugins.tooltip.backgroundColor;
    const originalBorder = tempChart.options.plugins.tooltip.borderColor;
    const originalTextColor = tempChart.options.plugins.legend.labels.color;
    const originalGridColorX = tempChart.options.scales.x.grid.color;
    const originalGridColorY = tempChart.options.scales.y.grid.color;
    
    tempChart.options.plugins.tooltip.backgroundColor = "#ffffff";
    tempChart.options.plugins.tooltip.borderColor = "#1e293b";
    tempChart.options.plugins.legend.labels.color = "#1e293b";
    tempChart.options.scales.x.ticks.color = "#1e293b";
    tempChart.options.scales.y.ticks.color = "#1e293b";
    tempChart.options.scales.x.grid.color = "rgba(203,213,225,0.8)";
    tempChart.options.scales.y.grid.color = "rgba(203,213,225,0.8)";
    
    tempChart.update('none');

    const canvas = document.getElementById("tempChart");
    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tCtx = tempCanvas.getContext("2d");
    
    tCtx.fillStyle = "#ffffff";
    tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
    tCtx.drawImage(canvas, 0, 0);

    const a = document.createElement("a");
    a.href = tempCanvas.toDataURL("image/png");
    a.download = "temperature_chart.png";
    a.click();

    isExporting = false;
    tempChart.options.plugins.tooltip.backgroundColor = originalBg;
    tempChart.options.plugins.tooltip.borderColor = originalBorder;
    tempChart.options.plugins.legend.labels.color = originalTextColor;
    tempChart.options.scales.x.ticks.color = originalTextColor;
    tempChart.options.scales.y.ticks.color = originalTextColor;
    tempChart.options.scales.x.grid.color = originalGridColorX;
    tempChart.options.scales.y.grid.color = originalGridColorY;
    
    tempChart.update('none');
  });

  btnZoomReset.addEventListener("click", () => {
    if (tempChart) {
      minIndex = 0;
      const xAxisPadding = Math.ceil(totalDataPoints * 0.05); 
      maxIndex = totalDataPoints - 1 + xAxisPadding;
      tempChart.options.scales.x.min = 0;
      tempChart.options.scales.x.max = maxIndex;
      tempChart.update();
    }
  });

  btnClear.addEventListener("click", () => {
    lastReport = "";
    fileInfo.textContent = "No file loaded";
    buildCards();
    chartContainer.innerHTML = "";
    if (tempChart){ tempChart.destroy(); tempChart = null; }
    runtimeCard.style.display = "none";
    btnCopy.disabled = true;
    btnSave.disabled = true;
    btnSaveImg.disabled = true;
    btnClear.disabled = true;
    btnZoomReset.disabled = true;
    fileInput.value = "";
  });

} catch (e) {
  alert("Initialization Error: " + e.message);
}
</script>
</body>
